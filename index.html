<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DKY Jewelry</title>
  <meta name="description" content="Compra joyas de oro fino de 14k a 22k y vende tu oro a tasas internacionales en vivo. Transparente, justo y rápido." />
  <link rel="icon" href="assets/dky-logo.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="bg-glow">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>

  <header id="site-header">
    <div class="container header-inner">
      <a href="#/" class="brand">
        <img src="assets/dky-logo.png" alt="DKY Jewelry" width="40" height="40" />
        <span class="brand-text brand-text-up">DKY <small>JEWELRY</small></span>
      </a>
      <nav class="main-nav" id="main-nav">
        <a href="#/shop" data-route="/shop" data-i18n="nav_shop">Tienda</a>
        <a href="#/sell-gold" data-route="/sell-gold" data-i18n="nav_sell">Vende tu Oro</a>
      </nav>
      <div class="header-actions">
        <button type="button" id="cart-btn" class="btn-icon-pill" aria-label="Abrir carrito">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span data-i18n="cart_btn">Carrito</span>
          <span id="cart-count" class="cart-badge" hidden>0</span>
        </button>
        <button type="button" id="theme-toggle" class="btn-icon" aria-label="Cambiar tema">
          <svg id="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg id="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button type="button" id="lang-toggle" class="btn-icon-pill" aria-label="Cambiar idioma">
          <span id="lang-indicator">ES</span>
        </button>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <footer id="site-footer">
    <div class="container footer-inner">
        <div class="brand">
          <img src="assets/dky-logo.png" alt="" width="32" height="32" />
          <span class="brand-text">DKY <small>JEWELRY</small><br><span class="muted small" data-i18n="footer_tagline">Oro real. Valor real.</span></span>
        </div>
      <a href="#/shop" data-i18n="nav_shop">Tienda</a>
      <a href="#/sell-gold" data-i18n="nav_sell">Vende tu Oro</a>
    </div>
    <p class="muted xsmall last">© <span id="year"></span> DKY Jewelry. Precios indicativos — confirmados vía WhatsApp.</p>
  </footer>

  <!-- Cart drawer -->
  <div id="cart-overlay" class="overlay" hidden></div>
  <aside id="cart-drawer" class="drawer" hidden aria-hidden="true">
    <header class="drawer-head">
      <h2 data-i18n="cart_title">Tu Selección</h2>
      <button type="button" id="cart-close" class="btn-icon" aria-label="Cerrar carrito">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </header>
    <div id="cart-body" class="drawer-body"></div>
    <footer id="cart-footer" class="drawer-foot" hidden></footer>
  </aside>

  <!-- Scripts modulares -->
  <script src="config.js"></script>
  <script src="products.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/spot.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/shop.js"></script>
  <script src="js/pages/product.js"></script>
  <script src="js/pages/sell.js"></script>
  <script src="js/pages/not-found.js"></script>
  <script src="js/router.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
